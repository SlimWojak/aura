id: ichi_tk_strong_trend_cloud_color_v0
title: Strong TK trend-only with cloud color alignment
status: draft
thesis: Require displaced cloud color to agree with the strong TK cross direction, then admit only Phase 2 trend-aligned entries.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_tk_strong_trend_only_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cloud_bias
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
  require_cloud_color_align: true
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 25
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless pre-registered chronological 70/30 IS and OOS halves both beat fee-on parent ichi_tk_strong_trend_only_v0 on total_pnl_points_after_fees with min_trades in each half. Default evidence path is eval_run cartridge --oos-split 0.7 --fee-bps 4 --regime-tf 4h --regime-htf 1d.
sources:
  - docs/REGIME.md
  - research/cartridges/ichi_tk_strong_trend_only_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: Strong TK parent plus Span A greater than Span B for long and Span A less than Span B for short, using displaced spans at the decision bar. Must beat the parent in both IS and OOS or die as a no-op.
