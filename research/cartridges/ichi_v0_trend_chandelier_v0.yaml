id: ichi_v0_trend_chandelier_v0
title: Ichimoku trend Chandelier trail exit draft
status: draft
thesis: Test whether an ATR-scaled Chandelier trail improves the Phase 2 trend-gated 20/60/120/60 baseline by letting winners run while tightening only after favorable range expansion.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_params_20_60_trend_v0
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: chandelier_trail
  close_on_flat: false
  close_on_opposite: false
  max_bars_in_trade: null
  chandelier_period: 22
  atr_period: 14
  atr_mult: 3.0
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 55000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: atr_normalized_total_return
  notes: "Paper draft only. Forced 70/30 fee-on OOS must beat the fee-on regime-gated ichi_params_20_60_trend_v0 baseline on ATR-normalized total return, and max DD must not exceed that baseline by more than 10% on either split."
sources:
  - docs/EVAL.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Track C exit-vocabulary draft; new id only. Same always_on 20/60/120/60 entry as ichi_params_20_60_trend_v0 under the Phase 2 TREND CLI gate, but exits on a close through a tighten-only Chandelier trail: highest_high(22) - 3.0 * ATR(14) for longs and lowest_low(22) + 3.0 * ATR(14) for shorts. close_on_flat/close_on_opposite are false so this A/B isolates the trail from bias_flip. CoS will run the dexter bake-off after merge."
