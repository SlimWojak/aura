id: ichi_p2_abfull_eth_v0
title: Phase 2 ablation AB-FULL ETH full stack
status: draft
thesis: Re-run the 20/60/120/60 trend parent entry on PF_ETHUSD with the complete Phase 2 regime hard veto so component-removal cartridges have a locked full-stack comparator.
symbol: PF_ETHUSD
tf: 1h
baseline_ref: ichi_params_20_60_trend_v0
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params:
    phase2_ablation:
      enabled: true
      label: AB-FULL
      components:
        adx_di: true
        kumo_width_atr: true
        htf_veto: true
        dwell_hysteresis: true
kill_criteria:
  max_dd_points: 2000
  min_trades: 12
  must_beat_baseline: false
  baseline_metric: atr_normalized_total_return
  notes: "Draft ablation comparator. Run forced 70/30 fee-on OOS on PF_ETHUSD with --regime-tf 4h --regime-htf 1d --trial-count 12 and report ATR-normalized Calmar/MAR plus DSR."
sources:
  - docs/REGIME.md
  - docs/EVAL.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Phase-2 ablation cartridge AB-FULL for PF_ETHUSD. This keeps ADX/DI, kumo width/ATR, 1d HTF veto, and dwell/hysteresis enabled. Component removals earn their place only if removal materially worsens ATR Calmar or DSR on both PF_XBTUSD and PF_ETHUSD versus this AB-FULL comparator. Count toward honest trial N."
