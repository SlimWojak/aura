id: ichi_er_regime_v0
title: Ichimoku v0 with ER regime gate
status: queued
thesis: Intern round-2 thesis that Kaufman Efficiency Ratio should filter chop better than ADX and improve expectancy while preserving baseline Ichimoku exits.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: er
  params:
    period: 10
    threshold: 0.3
kill_criteria:
  max_dd_points: 9000
  min_trades: 30
  must_beat_baseline: true
  baseline_metric: total_pnl_points
  notes: Kill unless ER-gated raw or fee-adjusted total PnL beats the baseline with a usable sample.
sources:
  - docs/BUILD_PLAN.md
  - research/cartridges/ichi_adx_regime_v0.yaml
notes: "Intern: ER better than ADX for expectancy. Entries require ER >= 0.3; exits follow baseline bias flips."
