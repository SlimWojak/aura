id: ichi_params_20_60_trend_v0
title: Ichimoku 20 60 trend-gated OOS variant
status: kept
thesis: Re-test the slower 20/60/120/60 Ichimoku parameter family under the Phase 2 trend veto to see whether reduced whipsaw survives a fee-on chronological IS/OOS split.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 50000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kept provisional paper only by the 2026-08-22 R3 bank in docs/LEDGER.md; PF_XBTUSD OOS passed, but ETH secondary OOS failed and DD was large, so this is not live.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Kept provisional paper only after the 2026-08-22 R3 Curator status bank in docs/LEDGER.md; not live. Evidence path: eval_run cartridge --id ichi_params_20_60_trend_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7 for forced 70/30 OOS. PF_XBTUSD OOS pass_oos_gate=true with OOS pnl_fee +13287.2384; PF_ETHUSD secondary OOS pass_oos_gate=false with OOS pnl_fee -107.77412; DD large. Compare only against fee-on regime-gated ichi_v0_baseline on both chronological halves; do not compare against or revive TK-strong killed parents."
