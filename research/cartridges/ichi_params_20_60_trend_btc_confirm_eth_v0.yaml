id: ichi_params_20_60_trend_btc_confirm_eth_v0
title: Ichimoku 20 60 ETH trend with BTC same-bar confirm
status: draft
thesis: Test whether ETH inherits the provisional 20/60/120/60 trend-gated structure only when BTC confirms the same-side Phase 2 trend and same-bar cloud/TK agreement.
symbol: PF_ETHUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
  confirm_symbol: PF_XBTUSD
  require_confirm_same_bar: true
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 2000
  min_trades: 10
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless forced 70/30 ETH IS and OOS beat the fee-on regime-gated ETH ichi_v0_baseline on total_pnl_points_after_fees, ETH OOS fee-on pnl is greater than zero, and the BTC-confirm gate is not a no-op versus plain ETH 20/60 TREND with an identical trade set. Missing or unaligned BTC candles/regime labels fail closed.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "R6 Research Intern ETH-positive structure. Paper-only draft; do not mutate kept parent ichi_params_20_60_trend_v0. Evidence path: eval_run cartridge --id ichi_params_20_60_trend_btc_confirm_eth_v0 --symbol PF_ETHUSD --tf 1h --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7. Entry requires ETH always_on 20/60/120/60 Chikou-close signal plus same-bar PF_XBTUSD confirm_symbol at the exact ETH ts_ms: BTC Phase 2 label must allow the same side and BTC close-vs-cloud plus TK state must agree. Fail closed if BTC candles, timestamps, or regime labels cannot align."
