id: ichi_tk_strong_trend_kijun_dip_v0
title: Strong TK trend-only with Kijun dip setup
status: draft
thesis: Require a short pullback or dip into the Kijun relationship before the strong TK reclaim, then admit only Phase 2 trend-aligned entries.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_tk_strong_trend_only_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cloud_bias
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
  require_kijun_dip_setup: true
  setup_bars: 8
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 25
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless pre-registered chronological 70/30 IS and OOS halves both beat fee-on parent ichi_tk_strong_trend_only_v0 on total_pnl_points_after_fees with min_trades in each half. Default evidence path is eval_run cartridge --oos-split 0.7 --fee-bps 4 --regime-tf 4h --regime-htf 1d.
sources:
  - docs/REGIME.md
  - research/cartridges/ichi_tk_strong_trend_only_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: Strong TK parent plus setup_bars 8. Long requires some prior setup bar with Tenkan <= Kijun before the bullish reclaim cross; short mirrors with Tenkan >= Kijun. Not a keep unless both chronological IS and OOS fee-on gates beat the parent.
