id: ichi_tk_strong_trend_only_v0
title: Strong TK cross with Phase 2 trend-only veto
status: draft
thesis: Re-run the strict TK-cloud cross only when Phase 2 regime permissioning agrees with the side, so long entries require TREND_BULL and short entries require TREND_BEAR.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cloud_bias
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 25
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Not a keep. CoS OOS bake-off found the full-sample fee-on positive result was IS-driven; BTC OOS last 30 percent was fee-on negative and ETH was flat.
sources:
  - docs/REGIME.md
  - research/cartridges/ichi_tk_cloud_strong_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: OOS failed and parent is not a keep. Keep runnable only as the fee-on parent comparator for TK-strong refinement bake-offs. Requires eval_run cartridge --regime-tf; the signal is identical to ichi_tk_cloud_strong_v0, while Phase 2 hard veto admits long only in TREND_BULL and short only in TREND_BEAR.
