id: ichi_params_20_60_trend_eth_dd_v0
title: Ichimoku 20 60 trend-gated ETH drawdown retest
status: draft
thesis: Re-run the kept 20/60/120/60 always-on Ichimoku signal under the Phase 2 trend veto with a tighter drawdown gate and explicit BTC plus ETH evidence requirements.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 25000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless the new id beats the fee-on regime-gated baseline on BTC IS and OOS plus ETH OOS, keeps BTC maxDD at or below 25000 points, and preserves at least 12 trades per half.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "new id only; do not revive or mutate killed parents. Same always_on 20/60/120/60 signal as kept parent ichi_params_20_60_trend_v0 with Chikou close confirmation and bias_flip exits. Forced 70/30 on BTC and ETH; beat fee-on regime-gated baseline on BTC IS+OOS and ETH OOS; BTC maxDD <= 25000. Evidence command: eval_run cartridge --id ichi_params_20_60_trend_eth_dd_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7."
