id: ichi_tk_strong_trend_oos_v0
title: Strong TK trend-only chronological OOS bake-off
status: draft
thesis: Re-test the parent strong TK trend-only cartridge under a pre-registered chronological 70/30 IS/OOS split after CoS found the full-sample fee-on positive result was IS-driven.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cloud_bias
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 25
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless pre-registered chronological 70/30 IS and OOS halves both beat fee-on baseline on total_pnl_points_after_fees with min_trades in each half. Default evidence path is eval_run cartridge --oos-split 0.7 --fee-bps 4 --regime-tf 4h --regime-htf 1d.
sources:
  - docs/REGIME.md
  - research/cartridges/ichi_tk_strong_trend_only_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: Signal is intentionally identical to ichi_tk_strong_trend_only_v0. This is not a keep unless the 70/30 chronological bake-off passes both IS and OOS fee-on gates with min_trades per half.
