id: ichi_params_20_60_trend_long_only_v0
title: Ichimoku 20 60 trend-gated long-only retest
status: draft
thesis: Test whether removing short exposure from the provisional 20/60/120/60 Phase 2 trend keep improves ETH OOS behavior and caps BTC OOS drawdown without changing the kept parent.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 12000
  min_trades: 10
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless forced 70/30 fee-on Phase 2 regime-gated BTC IS and OOS beat ichi_v0_baseline on total_pnl_points_after_fees, ETH OOS beats ETH regime-gated baseline, and BTC OOS max_dd_points is <= 12000.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "R5 Research Intern draft only; does not mutate the provisional keep. Same always_on 20/60/120/60 parameters as ichi_params_20_60_trend_v0, but entry_rules.allowed_sides restricts the cartridge to long only. Long only when TREND_BULL: Phase 2 CLI already side-locks entries, and this cartridge also restricts sides. Evidence path: eval_run cartridge --id ichi_params_20_60_trend_long_only_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7. ETH OOS beat required; BTC OOS max_dd <= 12000."
