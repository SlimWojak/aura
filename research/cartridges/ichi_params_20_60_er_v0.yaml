id: ichi_params_20_60_er_v0
title: Ichimoku 20 60 parameter variant with ER gate
status: queued
thesis: Combine the slower 20/60/120/60 Ichimoku variant with ER chop filtering to test whether fewer, stronger regime-aligned entries survive fee-aware scoring.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: er
  params:
    period: 10
    threshold: 0.3
kill_criteria:
  max_dd_points: 50000
  min_trades: 20
  must_beat_baseline: true
  baseline_metric: total_pnl_points
  notes: Kill unless the slow ER variant beats baseline total PnL after applying fee-aware metrics when fee_bps is set.
sources:
  - docs/BUILD_PLAN.md
  - research/cartridges/ichi_params_20_60_v0.yaml
notes: Fee-aware scoring is required before interpreting this slow-parameter variant.
