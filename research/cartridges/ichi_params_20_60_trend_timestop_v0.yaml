id: ichi_params_20_60_trend_timestop_v0
title: Ichimoku 20 60 trend-gated time-stop retest
status: killed
thesis: Test whether the provisional 20/60/120/60 Phase 2 trend keep can reduce stale-trend drawdown by forcing exits after three days while preserving the same cloud, TK, and Chikou confirmations.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: time_stop
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: 72
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 12000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Killed by the 2026-08-22 R5 Curator status bank in docs/LEDGER.md; PF_XBTUSD OOS pass_oos_gate=false with IS max_dd 14252 > 12000 and OOS max_dd 11757 not better than parent, and PF_ETHUSD OOS pass_oos_gate=false with OOS pnl_fee -212.04224.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Killed by the 2026-08-22 R5 Curator status bank in docs/LEDGER.md; does not mutate the provisional parent keep. Same always_on 20/60/120/60 entry as ichi_params_20_60_trend_v0 with Chikou close confirmation, but adds a 72-bar time stop while preserving close_on_flat and close_on_opposite. Evidence path: eval_run cartridge --id ichi_params_20_60_trend_timestop_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7. PF_XBTUSD OOS pass_oos_gate=false: IS 103t WR 0.3592 pnl_fee +20139.3588 max_dd 14252; OOS 47t WR 0.4681 pnl_fee +13663.2796 max_dd 11757. PF_ETHUSD OOS pass_oos_gate=false: IS 96t WR 0.3542 pnl_fee +233.8314 max_dd 1379.6; OOS 49t WR 0.3673 pnl_fee -212.04224 max_dd 883.5. Kill: BTC IS DD >12000; OOS DD not better than parent; ETH OOS fail."
