id: ichi_tk_cross_trend_v0
title: Plain TK cross trend-gated OOS variant
status: draft
thesis: Test a plain Tenkan Kijun cross event with only close-vs-cloud confirmation under the Phase 2 trend veto, without requiring both TK lines outside the cloud.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cross
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 40000
  min_trades: 15
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless forced 70/30 IS and OOS halves both beat fee-on regime-gated ichi_v0_baseline on total_pnl_points_after_fees with min_trades in each half; also kill if the trade set matches the dead TK-strong parent.
sources:
  - docs/REGIME.md
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/brain/ichimoku.py
  - runtime/eval/backtest_ichimoku.py
notes: "Evidence path: eval_run cartridge --id ichi_tk_cross_trend_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7. Plain TK cross plus close outside cloud only; this is not both-lines-outside TK-strong and must not revive killed TK-strong ids."
