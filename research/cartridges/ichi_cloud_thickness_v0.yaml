id: ichi_cloud_thickness_v0
title: Ichimoku v0 with cloud thickness gate
status: queued
thesis: Require a minimum displaced Kumo thickness so baseline entries only fire when the cloud has enough separation to avoid thin-cloud chop.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: cloud_thickness
  params:
    min_pct: 0.5
kill_criteria:
  max_dd_points: 9000
  min_trades: 30
  must_beat_baseline: true
  baseline_metric: total_pnl_points
  notes: Kill unless the thickness-gated run improves total PnL versus baseline without starving the trade sample.
sources:
  - docs/BUILD_PLAN.md
  - runtime/brain/ichimoku.py
notes: "Thickness is (kumo_top - kumo_bot) / close * 100 using displaced spans; entries fail closed when spans are missing."
