id: ichi_v0_trend_atr_stop_v0
title: Ichimoku trend ATR stop exit kill
status: killed
thesis: Test whether a static ATR-scaled hard stop at paper entry reduces drawdown versus the Phase 2 trend-gated 20/60/120/60 bias_flip baseline without over-truncating winners.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_params_20_60_trend_v0
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: atr_stop
  close_on_flat: false
  close_on_opposite: false
  max_bars_in_trade: null
  atr_period: 14
  atr_mult: 3.0
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 55000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: atr_normalized_total_return
  notes: "Killed forever by the 2026-08-22 Track C exit-vocabulary bank in docs/LEDGER.md. Forced 70/30 fee-on OOS had to beat parent ichi_params_20_60_trend_v0 on ATR-normalized total return, keep ATR maxDD within 1.10x parent on both splits, and meet min_trades >= 12. PF_XBTUSD OOS ATR total 36.61 beat parent 27.45, but OOS trades were 4 < 12 and DD was catastrophic; PF_ETHUSD failed."
sources:
  - docs/LEDGER.md
  - docs/EVAL.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Killed forever by the 2026-08-22 Track C exit-vocabulary bank in docs/LEDGER.md; new id only, do not revive. Paper-only evidence from dexter at 9d53c79 with AURA_ROOT=/var/aura and flags --tf 1h --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7 --atr-period 14 --trial-count 34 --metrics-only. Evidence path: /var/aura/evidence/evals/track-c-exit-vocab-20260822/. Same always_on 20/60/120/60 entry as ichi_params_20_60_trend_v0 under the Phase 2 TREND CLI gate, but exits a long on a closed-bar close at or below entry - 3.0 * ATR(14), and exits a short at or above entry + 3.0 * ATR(14). ATR is captured from the entry decision bar, not future bars. PF_XBTUSD OOS ATR total 36.61 beat parent 27.45, but OOS trades were 4 < 12 and DD was catastrophic; PF_ETHUSD failed. Parent remains kept provisional paper only; this does not revive any R5 kill."
