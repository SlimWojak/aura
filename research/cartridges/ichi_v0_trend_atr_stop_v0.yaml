id: ichi_v0_trend_atr_stop_v0
title: Ichimoku trend ATR stop exit draft
status: draft
thesis: Test whether a static ATR-scaled hard stop at paper entry reduces drawdown versus the Phase 2 trend-gated 20/60/120/60 bias_flip baseline without over-truncating winners.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_params_20_60_trend_v0
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: atr_stop
  close_on_flat: false
  close_on_opposite: false
  max_bars_in_trade: null
  atr_period: 14
  atr_mult: 3.0
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 55000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: atr_normalized_total_return
  notes: "Paper draft only. Forced 70/30 fee-on OOS must beat the fee-on regime-gated ichi_params_20_60_trend_v0 baseline on ATR-normalized total return, and max DD must not exceed that baseline by more than 10% on either split."
sources:
  - docs/EVAL.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Track C exit-vocabulary draft; new id only. Same always_on 20/60/120/60 entry as ichi_params_20_60_trend_v0 under the Phase 2 TREND CLI gate, but exits a long on a closed-bar close at or below entry - 3.0 * ATR(14), and exits a short at or above entry + 3.0 * ATR(14). ATR is captured from the entry decision bar, not future bars. close_on_flat/close_on_opposite are false so this A/B isolates the stop from bias_flip. CoS will run the dexter bake-off after merge."
