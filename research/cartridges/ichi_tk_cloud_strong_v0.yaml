id: ichi_tk_cloud_strong_v0
title: Strong TK cross outside cloud
status: queued
thesis: Upgrade the phase-2 TK-cloud seed to require a true Tenkan Kijun cross event with both TK lines and close fully outside the displaced cloud before taking a new paper entry.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: tk_cloud_bias
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tk_cross_only
  require_chikou_confirmation: false
  chikou_mode: close
exit_rules:
  mode: flat_on_rule_fail
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 25
  must_beat_baseline: true
  baseline_metric: total_pnl_points
  notes: Kill unless strict TK-cloud entries beat baseline total PnL after fees when fee_bps is set.
sources:
  - docs/BUILD_PLAN.md
  - runtime/brain/ichimoku.py
notes: "Long iff tk_bull_cross and tenkan, kijun, and close are all above kumo_top; short mirrors below kumo_bot. Fail closed if displaced spans are missing. Fee-aware scoring required."
