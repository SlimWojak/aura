id: ichi_params_20_60_trend_long_only_n8_v0
title: Ichimoku 20 60 trend long-only n8 retest
status: draft
thesis: Re-test the long-only 20/60/120/60 Phase 2 trend idea as a new pre-registered id with min_trades 8 rather than polishing the killed R5 long-only cartridge.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 20
  kijun: 60
  senkou_b: 120
  displacement: 60
entry_rules:
  mode: always_on
  allowed_sides:
    - long
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 12000
  min_trades: 8
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless forced 70/30 BTC IS and OOS beat the fee-on regime-gated baseline, ETH OOS beats its fee-on regime-gated baseline, and BTC OOS max_drawdown_points is at or below 12000. New id only; do not mutate or polish killed ichi_params_20_60_trend_long_only_v0.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_long_only_v0.yaml
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "R6 Research Intern long-only n8 draft. Paper-only new id versus killed long_only. Evidence path: eval_run cartridge --id ichi_params_20_60_trend_long_only_n8_v0 --symbol PF_XBTUSD --tf 1h --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7, plus PF_ETHUSD secondary run. Same 20/60/120/60 always_on signal, Chikou close confirmation, bias_flip exits, and allowed_sides [long] as the killed long-only design, but pre-registers min_trades 8."
