id: ichi_chikou_open_space_v0
title: Strict Chikou open-space filter
status: queued
thesis: Keep the baseline cloud and Tenkan Kijun state, but require current close to clear the full candle range from the displaced Chikou reference bar so entries avoid crowded prior price action.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichimoku_v0
ichimoku:
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: strict
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 9000
  min_trades: 30
  must_beat_baseline: true
  baseline_metric: max_drawdown_points
  notes: Kill if stricter Chikou confirmation only starves the sample without reducing drawdown versus baseline.
sources:
  - docs/BUILD_PLAN.md
  - runtime/brain/ichimoku.py
notes: Strict Chikou compares long entries against high[t-displacement] and short entries against low[t-displacement] while preserving baseline cloud and TK state.
