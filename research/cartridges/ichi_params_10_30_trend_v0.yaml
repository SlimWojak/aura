id: ichi_params_10_30_trend_v0
title: Ichimoku 10 30 trend-gated OOS variant
status: killed
thesis: Test a mid-pack 10/30/60/30 always-on Ichimoku parameter family under the Phase 2 trend veto against the fee-on regime-gated baseline.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 10
  kijun: 30
  senkou_b: 60
  displacement: 30
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 25000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Killed by the 2026-08-22 R4 Curator status bank in docs/LEDGER.md because BTC OOS was thin and ETH failed; it does not displace the 20/60 keep.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Killed by the 2026-08-22 R4 Curator status bank in docs/LEDGER.md. Mid pack 10/30/60/30 always_on under TREND_* via the Phase 2 CLI regime hard veto. Same entry and exit shape as baseline always_on: close outside cloud, TK state aligned, Chikou close confirmation, and bias_flip exits. Evidence command: eval_run cartridge --id ichi_params_10_30_trend_v0 --fee-bps 4 --regime-tf 4h --regime-htf 1d --oos-split 0.7. PF_XBTUSD OOS pass_oos_gate=true but thin; PF_ETHUSD OOS pass_oos_gate=false. Does not displace the 20/60 keep."
