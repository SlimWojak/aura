id: ichi_params_10_30_trend_v0
title: Ichimoku 10 30 trend-gated OOS variant
status: draft
thesis: Test a mid-pack 10/30/60/30 always-on Ichimoku parameter family under the Phase 2 trend veto against the fee-on regime-gated baseline.
symbol: PF_XBTUSD
tf: 1h
baseline_ref: ichi_v0_baseline
ichimoku:
  tenkan: 10
  kijun: 30
  senkou_b: 60
  displacement: 30
entry_rules:
  mode: always_on
  allowed_sides:
    - long
    - short
  require_close_vs_cloud: above_for_long_below_for_short
  require_tk_state: tenkan_over_kijun_for_long_under_for_short
  require_chikou_confirmation: true
  chikou_mode: close
exit_rules:
  mode: bias_flip
  close_on_flat: true
  close_on_opposite: true
  max_bars_in_trade: null
regime:
  type: none
  params: {}
kill_criteria:
  max_dd_points: 25000
  min_trades: 12
  must_beat_baseline: true
  baseline_metric: total_pnl_points_after_fees
  notes: Kill unless the forced 70/30 fee-on regime-gated IS and OOS halves beat ichi_v0_baseline with at least 12 trades and maxDD no greater than 25000 points; ETH OOS is secondary evidence.
sources:
  - docs/LEDGER.md
  - docs/REGIME.md
  - research/cartridges/ichi_params_20_60_trend_v0.yaml
  - research/cartridges/ichi_v0_baseline.yaml
  - runtime/eval/backtest_ichimoku.py
notes: "Mid pack 10/30/60/30 always_on under TREND_* via the Phase 2 CLI regime hard veto. Same entry and exit shape as baseline always_on: close outside cloud, TK state aligned, Chikou close confirmation, and bias_flip exits. Forced 70/30; beat fee-on regime-gated baseline IS+OOS; ETH OOS secondary; maxDD 25000."
